{% extends "base.html" %}

{% block title %}Entrar — Caminhabilidade Urbana{% endblock %}

{% block content %}
  <h1>Entrar</h1>

  <form method="post" action="{% url 'contas:entrar' %}" class="formulario" novalidate>
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>

  <p>Ainda não tem conta? <a href="{% url 'contas:cadastro' %}">Criar conta</a></p>
{% endblock %}
